        .btn-submit:active {
            transform: translateY(-1px);

        .btn-submit:disabled {

        .success-message {

            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.5);

            display: none;

        .required {
            color: #f44336;

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;

            .form-container {

            .form-section {

            }
            
            .page-header {
                padding: 20px;
            }
            
            .header-content {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            
            .header-title h1 {
                font-size: 24px;

            .btn-back {
                justify-content: center;

<body>
    <div class="admin-container">
        <div class="form-container">
            <div class="page-header">
                <div class="header-content">
                    <div class="header-title">
                        <h1>Agregar Nuevo Reloj</h1>
                        <p>Completa la información del reloj para agregarlo al catálogo</p>
                    </div>
                    <div class="header-actions">
                        <a href="panel.php" class="btn-back">
                            <span>←</span> Volver al Panel
                        </a>
                    </div>
                </div>
            </div>
            <div id="successMessage" class="success-message">
                ✅ Reloj agregado exitosamente
            </div>
            
            <div id="errorMessage" class="error-message">
                ❌ Error al agregar el reloj
            </div>
            
            <form id="relojForm" class="form-section" enctype="multipart/form-data">
                <h2 class="form-title">Información del Reloj</h2>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="marca">Marca <span class="required">*</span></label>
                        <select id="marca" name="marca" required>
                            <option value="">Selecciona una marca</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="nombre">Nombre del Reloj <span class="required">*</span></label>
                        <input type="text" id="nombre" name="nombre" required maxlength="100">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="descripcion">Descripción <span class="required">*</span></label>
                    <textarea id="descripcion" name="descripcion" required placeholder="Describe las características del reloj..."></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="eslabones">Eslabones <span class="optional">(Opcional)</span></label>
                        <input type="text" id="eslabones" name="eslabones" maxlength="100" placeholder="Ej: 20 eslabones">
                    </div>
                    <div class="form-group">
                        <label for="tipo_bisel">Tipo de Bisel <span class="optional">(Opcional)</span></label>
                        <select id="tipo_bisel" name="tipo_bisel">
                            <option value="">Seleccionar tipo</option>
                            <option value="estatico">Estático</option>
                            <option value="giratorio">Giratorio</option>
                            <option value="giratorio_bidireccional">Giratorio Bidireccional</option>
                            <option value="estatico_ceramico">Estático Cerámico</option>
                            <option value="giratorio_ceramico">Giratorio Cerámico</option>
                            <option value="estatico_ceramico_dorado">Estático Cerámico Dorado</option>
                            <option value="giratorio_luminoso">Giratorio Luminoso</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="movimiento">Movimiento <span class="optional">(Opcional)</span></label>
                        <input type="text" id="movimiento" name="movimiento" maxlength="100" placeholder="Ej: Automático Swiss Made">
                    </div>
                    <div class="form-group">
                        <label for="pulsera">Pulsera <span class="optional">(Opcional)</span></label>
                        <input type="text" id="pulsera" name="pulsera" maxlength="100" placeholder="Ej: Cuero genuino">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="peso">Peso <span class="optional">(Opcional)</span></label>
                        <input type="text" id="peso" name="peso" maxlength="50" placeholder="Ej: 150g">
                    </div>
                    <div class="form-group">
                        <label for="resistencia_agua">Resistencia al Agua <span class="optional">(Opcional)</span></label>
                        <input type="text" id="resistencia_agua" name="resistencia_agua" maxlength="50" placeholder="Ej: 100m">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="precio">Precio (COP) <span class="required">*</span></label>
                        <input type="number" id="precio" name="precio" required min="0" step="0.01">
                    </div>
                    
                    <div class="form-group">
                        <label for="descuento">Descuento (%)</label>
                        <input type="number" id="descuento" name="descuento" min="0" max="100" step="0.01" placeholder="Opcional">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="imagen">Imagen Principal (Frontal) <span class="required">*</span></label>
                    <div class="file-upload">
                        <input type="file" id="imagen" name="imagen" accept="image/*" required>
                        <label for="imagen" class="file-upload-label">
                            📷 Haz clic para seleccionar imagen frontal
                        </label>
                    </div>
                    <div id="imagePreview" class="file-preview"></div>
                </div>
                
                <div class="form-group">
                    <label for="imagen_lateral">Imagen Lateral (Perfil) <span class="optional">(Opcional)</span></label>
                    <div class="file-upload">
                        <input type="file" id="imagen_lateral" name="imagen_lateral" accept="image/*">
                        <label for="imagen_lateral" class="file-upload-label">
                            📷 Haz clic para seleccionar imagen lateral
                        </label>
                    </div>
                    <div id="imagePreviewLateral" class="file-preview"></div>
                </div>
                
                <div class="form-group">
                    <label for="imagen_detalle">Imagen de Detalle (Bisel/Correa) <span class="optional">(Opcional)</span></label>
                    <div class="file-upload">
                        <input type="file" id="imagen_detalle" name="imagen_detalle" accept="image/*">
                        <label for="imagen_detalle" class="file-upload-label">
                            📷 Haz clic para seleccionar imagen de detalle
                        </label>
                    </div>
                    <div id="imagePreviewDetalle" class="file-preview"></div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="disponible" name="disponible" checked>
                            <label for="disponible">Reloj disponible para venta</label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="vendido" name="vendido">
                            <label for="vendido">Reloj vendido</label>
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="btn-submit" id="submitBtn">
                    Agregar Reloj
                </button>
            </form>
        </div>
    </div>
    
    <script>
        // Función para cargar marcas
        async function cargarMarcas() {
            try {
                const response = await fetch('php/obtener_marcas.php');
                const data = await response.json();
                
                if (data.success) {
                    const select = document.getElementById('marca');
                    select.innerHTML = '<option value="">Selecciona una marca</option>';
                    
                    data.marcas.forEach(marca => {
                        const option = document.createElement('option');
                        option.value = marca.nombre;
                        option.textContent = marca.nombre;
                        select.appendChild(option);
                    });
                } else {
                    console.error('Error al cargar marcas:', data.message);
                }
            } catch (error) {
                console.error('Error de conexión:', error);
            }
        }
        
        // Cargar marcas al iniciar la página
        document.addEventListener('DOMContentLoaded', cargarMarcas);
        
        // Preview de imágenes
        function setupImagePreview(inputId, previewId) {
            document.getElementById(inputId).addEventListener('change', function(e) {
                const file = e.target.files[0];
                const preview = document.getElementById(previewId);
                
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        preview.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                    };
                    reader.readAsDataURL(file);
                } else {
                    preview.innerHTML = '';
                }
            });
        }
        
        // Configurar previews para las 3 imágenes
        setupImagePreview('imagen', 'imagePreview');
        setupImagePreview('imagen_lateral', 'imagePreviewLateral');
        setupImagePreview('imagen_detalle', 'imagePreviewDetalle');
        
        // Validación de descuento
        document.getElementById('descuento').addEventListener('input', function() {
            const descuento = parseFloat(this.value);
            if (descuento > 100) {
                this.value = 100;
            }
        });
        
        // Manejo del formulario
        document.getElementById('relojForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const successMsg = document.getElementById('successMessage');
            const errorMsg = document.getElementById('errorMessage');
            
            // Ocultar mensajes anteriores
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';
            
            // Validación del frontend
            const imagenInput = document.getElementById('imagen');
            if (!imagenInput.files || imagenInput.files.length === 0) {
                errorMsg.textContent = '❌ El campo imagen es obligatorio';
                errorMsg.style.display = 'block';
                return;
            }
            
            // Validar otros campos obligatorios
            const camposObligatorios = ['marca', 'nombre', 'descripcion', 'precio'];
            for (let campo of camposObligatorios) {
                const input = document.getElementById(campo);
                if (!input.value.trim()) {
                    errorMsg.textContent = `❌ El campo ${campo} es obligatorio`;
                    errorMsg.style.display = 'block';
                    input.focus();
                    return;
                }
            }
            
            // Validar precio
            const precio = parseFloat(document.getElementById('precio').value);
            if (isNaN(precio) || precio <= 0) {
                errorMsg.textContent = '❌ El precio debe ser un número mayor a 0';
                errorMsg.style.display = 'block';
                document.getElementById('precio').focus();
                return;
            }
            
            // Deshabilitar botón
            submitBtn.disabled = true;
            submitBtn.textContent = 'Agregando...';
            
            // Crear FormData
            const formData = new FormData(this);
            
            // Enviar datos
            fetch('php/agregar_reloj.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    successMsg.textContent = `✅ ${data.message}`;
                    successMsg.style.display = 'block';
                    this.reset();
                    document.getElementById('imagePreview').innerHTML = '';
                    
                    // Scroll al mensaje de éxito
                    successMsg.scrollIntoView({ behavior: 'smooth' });
                } else {
                    errorMsg.textContent = `❌ ${data.message}`;
                    errorMsg.style.display = 'block';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                errorMsg.textContent = '❌ Error de conexión. Intenta nuevamente.';
                errorMsg.style.display = 'block';
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Agregar Reloj';
            });
        });
    </script>
</body>
</html>
