<body>
    <div class="admin-container">
        <div class="relojes-container">
            <div class="page-header">
                <div class="header-content">
                    <div class="header-title">
                        <h1>Gestionar Relojes</h1>
                        <p>Administra tu inventario de relojes desde aquí</p>
                    </div>
                    <div class="header-actions">
                        <a href="agregar_reloj.html" class="btn-agregar">Agregar Nuevo Reloj</a>
                        <a href="panel.php" class="btn-back">← Volver al Panel</a>
                    </div>
                </div>
            </div>
            <div id="errorMessage" class="error-message"></div>
            
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-number" id="totalRelojes">-</div>
                    <div class="stat-label">Total Relojes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="disponibles">-</div>
                    <div class="stat-label">Disponibles</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="vendidos">-</div>
                    <div class="stat-label">Vendidos</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="noDisponibles">-</div>
                    <div class="stat-label">No Disponibles</div>
                </div>
            </div>
            
            <div id="loadingMessage" class="loading">
                Cargando relojes...
            </div>
            
            <div id="relojesGrid" class="relojes-grid" style="display: none;">
                <!-- Los relojes se cargarán aquí dinámicamente -->
            </div>
        </div>
    </div>
    
    <script>
        let relojes = [];
        
        // Cargar relojes al iniciar
        document.addEventListener('DOMContentLoaded', function() {
            cargarRelojes();
        });
        
        function cargarRelojes() {
            const loadingMessage = document.getElementById('loadingMessage');
            const relojesGrid = document.getElementById('relojesGrid');
            const errorMessage = document.getElementById('errorMessage');
            
            loadingMessage.style.display = 'block';
            relojesGrid.style.display = 'none';
            errorMessage.style.display = 'none';
            
            fetch('php/listar_relojes.php')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        relojes = data.relojes;
                        mostrarRelojes(relojes);
                        actualizarEstadisticas(relojes);
                    } else {
                        mostrarError(data.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    mostrarError('Error de conexión. Intenta nuevamente.');
                })
                .finally(() => {
                    loadingMessage.style.display = 'none';
                });
        }
        
        function mostrarRelojes(relojes) {
            const relojesGrid = document.getElementById('relojesGrid');
            
            if (relojes.length === 0) {
                relojesGrid.innerHTML = '<div class="loading">No hay relojes registrados</div>';
                relojesGrid.style.display = 'block';
                return;
            }
            
            relojesGrid.innerHTML = relojes.map(reloj => `
                <div class="reloj-card">
                    <img src="../${reloj.img}" alt="${reloj.nombre}" class="reloj-image" 
                         onerror="this.src='../img/finoso_logo.png'">
                    <div class="reloj-info">
                        <div class="reloj-marca">${reloj.marca}</div>
                        <div class="reloj-nombre">${reloj.nombre}</div>
                        <div class="reloj-precio">${reloj.precio_formateado}</div>
                        ${reloj.descuento ? `<div class="reloj-descuento">Descuento: ${reloj.descuento_formateado}</div>` : ''}
                        <div class="reloj-estado" style="background: ${reloj.estado_color}20; color: ${reloj.estado_color}; border: 1px solid ${reloj.estado_color}40;">
                            ${reloj.estado}
                        </div>
                        <div class="reloj-actions">
                            <button class="btn-action btn-edit" onclick="editarReloj(${reloj.id_reloj})">
                                ✏️ Editar
                            </button>
                            <button class="btn-action btn-toggle" onclick="toggleDisponibilidad(${reloj.id_reloj})">
                                ${reloj.disponible ? '⏸️ Pausar' : '▶️ Activar'}
                            </button>
                            <button class="btn-action btn-delete" onclick="eliminarReloj(${reloj.id_reloj})">
                                🗑️ Eliminar
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
            
            relojesGrid.style.display = 'block';
        }
        
        function actualizarEstadisticas(relojes) {
            const total = relojes.length;
            const disponibles = relojes.filter(r => r.disponible && !r.vendido).length;
            const vendidos = relojes.filter(r => r.vendido).length;
            const noDisponibles = relojes.filter(r => !r.disponible && !r.vendido).length;
            
            document.getElementById('totalRelojes').textContent = total;
            document.getElementById('disponibles').textContent = disponibles;
            document.getElementById('vendidos').textContent = vendidos;
            document.getElementById('noDisponibles').textContent = noDisponibles;
        }
        
        function mostrarError(mensaje) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = '❌ ' + mensaje;
            errorMessage.style.display = 'block';
        }
        
        function editarReloj(id) {
            // TODO: Implementar edición de reloj
            alert('Funcionalidad de edición en desarrollo');
        }
        
        function toggleDisponibilidad(id) {
            const reloj = relojes.find(r => r.id_reloj === id);
            if (!reloj) return;
            
            const nuevaDisponibilidad = !reloj.disponible;
            const accion = nuevaDisponibilidad ? 'activar' : 'pausar';
            
            if (confirm(`¿Estás seguro de que quieres ${accion} este reloj?`)) {
                // TODO: Implementar toggle de disponibilidad
                alert(`Reloj ${accion}do (funcionalidad en desarrollo)`);
            }
        }
        
        function eliminarReloj(id) {
            const reloj = relojes.find(r => r.id_reloj === id);
            if (!reloj) return;
            
            if (confirm(`¿Estás seguro de que quieres eliminar "${reloj.nombre}"?\n\nEsta acción no se puede deshacer.`)) {
                // TODO: Implementar eliminación de reloj
                alert('Funcionalidad de eliminación en desarrollo');
            }
        }
    </script>
</body>
